      <text x="840" y="490" class="caption amber">Confiança do rótulo adicional</text>
    </g>

    <text x="64" y="533" class="small">Valores detalhados: registro do experimento [1]. Capturas exibem percentuais arredondados.</text>

    <rect x="64" y="552" width="1112" height="122" rx="10" fill="#EDF3EF"/>
    <rect x="64" y="566" width="4" height="94" rx="2" fill="#43715E"/>
    <text x="88" y="584" class="callout-title">Leitura correta</text>
    <text x="88" y="617" class="body">Banana recebeu 100% e coexistiu com Pear incorreto: não houve decisão exclusiva.</text>
    <text x="88" y="649" class="body">Confiança não equivale necessariamente a probabilidade estatisticamente calibrada.</text>
  </g>

