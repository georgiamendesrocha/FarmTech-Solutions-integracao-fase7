      <text x="84" y="490" class="caption">Confiança do rótulo</text>
    </g>
    <g id="resultado-banana" aria-label="Banana: Banana, confiança do rótulo de 100%">
      <rect x="442" y="336" width="354" height="168" rx="12" fill="#FFFFFF" stroke="#CCDAD0"/>
      <rect x="462" y="354" width="34" height="4" rx="2" fill="#24604B"/>
