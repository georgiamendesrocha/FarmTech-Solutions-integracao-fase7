    <g id="resultado-milho" aria-label="Milho: Corn, confiança do rótulo de 99,8351%">
      <rect x="64" y="336" width="354" height="168" rx="12" fill="#FFFFFF" stroke="#CCDAD0"/>
      <rect x="84" y="354" width="34" height="4" rx="2" fill="#24604B"/>
