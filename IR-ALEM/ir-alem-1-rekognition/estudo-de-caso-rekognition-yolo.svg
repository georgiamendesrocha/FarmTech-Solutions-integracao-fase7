    <text x="300" y="1058" class="body">localizadas quando retornadas.</text>
    <text x="750" y="1031" class="body">Classe, confiança e caixa</text>
    <text x="750" y="1058" class="body">por detecção.</text>

    <text x="88" y="1114" class="row-label">Personalização</text>
    <text x="300" y="1099" class="body">Modelo geral sem ajuste de</text>
    <text x="300" y="1126" class="body">pesos nesta atividade.</text>
    <text x="750" y="1099" class="body">Dados, classes, pesos e</text>
    <text x="750" y="1126" class="body">limiar podem ser ajustados.</text>

    <text x="64" y="1170" class="small">Comparação conceitual [1–3]. Protocolos diferentes não sustentam ranking de desempenho.</text>
