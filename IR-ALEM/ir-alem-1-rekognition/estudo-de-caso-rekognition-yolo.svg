<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1240 1754" role="img" aria-labelledby="titulo descricao" xml:lang="pt-BR">
  <title id="titulo">Rekognition e YOLO — estudo de caso visual da FarmTech Solutions</title>
  <desc id="descricao">Painel acadêmico autoral em uma página A4. O experimento Rekognition Labels 3.0, realizado manualmente no console AWS em us-east-1, retornou Corn com confiança de 99,8351%, Banana com 100% e, na mesma imagem de banana, Pear incorreto com 70,8036%. Banana e Pear coexistiram como rótulos, sem decisão exclusiva. Confiança não implica probabilidade estatisticamente calibrada. A comparação documental com a YOLOv5s customizada da Fase 6 aborda objetivo, treinamento, inferência, saídas e personalização, sem comparar métricas de protocolos diferentes. O fluxo conceitual segue Rekognition, avaliação individual das detecções, tratamento dos resultados e decisão assistida. Dois caminhos preservam Banana como identificação candidata válida e sinalizam Pear, identificação secundária incorreta no experimento, para revisão ou filtragem por regras previamente validadas. Casos ambíguos seguem para revisão humana conforme o risco. Classes e limiares não garantem eliminar erros. Essas estratégias não foram implementadas ou testadas; preservar uma candidata não autoriza manejo automático. Fontes locais vinculadas ao final.</desc>
