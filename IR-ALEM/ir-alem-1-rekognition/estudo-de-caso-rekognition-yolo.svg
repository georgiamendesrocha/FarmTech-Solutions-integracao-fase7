    <text x="750" y="827" class="body">Detectar e localizar</text>
    <text x="750" y="854" class="body">banana e milho.</text>

    <text x="88" y="910" class="row-label">Treinamento</text>
    <text x="300" y="895" class="body">Labels 3.0 pré-treinado;</text>
    <text x="300" y="922" class="body">sem treinamento pelo grupo.</text>
    <text x="750" y="895" class="body">Transfer learning de YOLOv5s;</text>
    <text x="750" y="922" class="body">imagens e caixas anotadas.</text>

    <text x="88" y="978" class="row-label">Inferência</text>
    <text x="300" y="963" class="body">Console AWS; processamento</text>
