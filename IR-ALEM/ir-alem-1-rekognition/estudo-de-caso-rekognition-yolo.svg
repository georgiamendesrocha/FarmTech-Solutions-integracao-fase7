  <g id="conclusao" aria-label="Conclusão crítica">
    <rect x="64" y="1542" width="1112" height="108" rx="12" fill="#173F32"/>
    <text x="88" y="1575" class="conclusion">Um objeto correto não valida todas as identificações.</text>
    <text x="88" y="1607" class="conclusion-body">O falso positivo Pear exige avaliar o conjunto das saídas.</text>
    <text x="88" y="1636" class="conclusion-body">Este experimento não valida decisões agrícolas automatizadas.</text>
  </g>

