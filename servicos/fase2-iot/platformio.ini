[platformio]
; Filtros Python do monitor serial (gravacao CSV) em monitor/
monitor_dir = monitor

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev

monitor_speed = 115200
; Grava dados/historico_irrigacao.csv ao abrir o Monitor Serial (VSCode / pio device monitor)
monitor_filters = default, irrigation_csv

lib_deps =
  beegee-tokyo/DHT sensor library for ESPx @ ^1.19